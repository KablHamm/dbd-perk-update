# Keep perks-update.json in step with the wiki without a PC being switched on.
#
# The perk tables on deadbydaylight.wiki.gg are generated by a Lua module, so
# the only machine-readable form of them is the rendered HTML.
# tools/build_perk_update.py reads that HTML, drops the perks the app already
# bundles, and writes the remainder to perks-update.json. The r1 reads this file
# from raw.githubusercontent.com, which sends Access-Control-Allow-Origin: *,
# so the device can fetch it even though the wiki sends no CORS header at all.
name: refresh perk delta

on:
  schedule:
    # 06:17 UTC. Not on the hour: GitHub queues scheduled runs, and they do not
    # all start the moment they come due.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perk-delta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape the wiki and rebuild the delta
        # pipefail: without it a scraper that dies leaves the step green on
        # tee's exit code, the delta unchanged, and the guard below reports
        # "unchanged" - a failed scrape would look like a successful run.
        run: set -o pipefail; python tools/build_perk_update.py | tee delta.log

      - name: Has the delta actually changed
        id: changed
        run: |
          git show HEAD:perks-update.json > "$RUNNER_TEMP/before.json"
          python tools/delta_changed.py "$RUNNER_TEMP/before.json" perks-update.json

      - name: Publish the new delta
        if: steps.changed.exit_code == 1
        run: |
          git config user.name  "os3 perk picker"
          git config user.email "os3-perk-picker@users.noreply.github.com"
          subject=$(grep -E '^[[:space:]]+[-+] ' delta.log \
                    | sed -E 's/^[[:space:]]+[-+] //' \
                    | head -20 | paste -sd'; ' -)
          [ -n "$subject" ] || subject="wiki totals changed"
          git add perks-update.json
          git commit -m "$subject"
          git push